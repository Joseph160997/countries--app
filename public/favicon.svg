<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Terra Atlas social preview</title>
  <desc id="desc">A dark vector preview card for Terra Atlas with a bold headline, descriptive subtitle, and stylized country flags.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a" />
      <stop offset="100%" stop-color="#0e1a30" />
    </linearGradient>
    <linearGradient id="card" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0b1220" stop-opacity="0.95" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.18" />
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0" />
    </radialGradient>
    <pattern id="topo" width="240" height="240" patternUnits="userSpaceOnUse">
      <path d="M0 36c30-14 60 10 90-4s60-22 90-8 40 18 60 12" fill="none" stroke="#e9eff8" stroke-opacity="0.04" stroke-width="2" />
      <path d="M0 92c34-18 62 6 94-8s58-18 88-6 38 14 58 10" fill="none" stroke="#e9eff8" stroke-opacity="0.04" stroke-width="2" />
      <path d="M0 148c28-12 58 8 92-6s62-16 90-4 36 12 58 8" fill="none" stroke="#e9eff8" stroke-opacity="0.04" stroke-width="2" />
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#topo)" opacity="0.8" />
  <circle cx="1030" cy="120" r="280" fill="url(#glow)" />

  <rect x="80" y="70" width="1040" height="490" rx="28" fill="url(#card)" filter="url(#shadow)" />
  <rect x="80" y="70" width="1040" height="490" rx="28" fill="url(#topo)" opacity="0.16" />

  <g transform="translate(110 120)">
    <text x="0" y="0" font-family="'Instrument Sans', 'Segoe UI', sans-serif" font-size="16" font-weight="700" letter-spacing="3" fill="#fbbf24" text-transform="uppercase">★ An interactive atlas</text>
    <text x="0" y="102" font-family="'Bricolage Grotesque', 'Segoe UI', sans-serif" font-size="92" font-weight="800" fill="#f5efe6" letter-spacing="-2">Terra<tspan fill="#fbbf24">.</tspan></text>
    <text x="0" y="170" font-family="'Instrument Sans', 'Segoe UI', sans-serif" font-size="24" fill="#a8a39b" font-weight="500">
      <tspan x="0" dy="0">Every country on Earth — live weather, Wikipedia summaries,</tspan>
      <tspan x="0" dy="34">demographics and a beautiful day-to-night experience.</tspan>
    </text>
  </g>

  <g transform="translate(748 120)">
    <g transform="translate(0 0)">
      <rect x="0" y="0" width="140" height="96" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" />
      <rect x="0" y="0" width="46" height="96" fill="#0055a4" />
      <rect x="46" y="0" width="48" height="96" fill="#ffffff" />
      <rect x="94" y="0" width="46" height="96" fill="#ef4135" />
    </g>
    <g transform="translate(150 0)">
      <rect x="0" y="0" width="140" height="96" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" />
      <circle cx="70" cy="48" r="26" fill="#bc002d" />
    </g>
    <g transform="translate(300 0)">
      <rect x="0" y="0" width="140" height="96" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" />
      <path d="M0 0h140v96H0z" fill="#009c3b" />
      <path d="M0 0l70 48 70-48v96L70 48 0 96z" fill="#ffdf00" />
      <circle cx="70" cy="48" r="24" fill="#002776" />
    </g>

    <g transform="translate(0 112)">
      <rect x="0" y="0" width="140" height="96" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" />
      <rect x="0" y="0" width="46" height="96" fill="#008c45" />
      <rect x="46" y="0" width="48" height="96" fill="#ffffff" />
      <rect x="94" y="0" width="46" height="96" fill="#cd212a" />
    </g>
    <g transform="translate(150 112)">
      <rect x="0" y="0" width="140" height="96" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" />
      <rect x="0" y="0" width="140" height="96" fill="#02529c" />
      <rect x="0" y="0" width="140" height="96" fill="#ffffff" opacity="0.2" />
      <rect x="34" y="0" width="18" height="96" fill="#ed2939" />
      <rect x="0" y="39" width="140" height="18" fill="#ed2939" />
      <path d="M0 0h140v96H0z" fill="none" stroke="#ffffff" stroke-width="10" opacity="0.6" />
    </g>
    <g transform="translate(300 112)">
      <rect x="0" y="0" width="140" height="96" rx="12" fill="#ffffff" stroke="#e5e7eb" stroke-width="2" />
      <rect x="0" y="0" width="140" height="96" fill="#fcd116" />
      <rect x="0" y="0" width="140" height="32" fill="#003893" />
      <rect x="0" y="64" width="140" height="32" fill="#ce1126" />
    </g>
  </g>

  <g transform="translate(110 470)">
    <text x="0" y="0" font-family="'Bricolage Grotesque', 'Segoe UI', sans-serif" font-size="20" font-weight="800" fill="#f5efe6">Terra<tspan fill="#fbbf24">.</tspan></text>
    <text x="140" y="0" font-family="'JetBrains Mono', 'Consolas', monospace" font-size="12" font-weight="700" letter-spacing="3" fill="#6b6960" text-transform="uppercase">Atlas</text>
  </g>
</svg>
