<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Terra Atlas — premium social preview</title>
  <desc id="desc">A premium dark vector illustration for Terra Atlas with elegant gradients, gold accents and stylized country flags.</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07111f" />
      <stop offset="55%" stop-color="#0d1728" />
      <stop offset="100%" stop-color="#111c31" />
    </linearGradient>
    <linearGradient id="panel" x1="0%" y1="0%" x2="100%" y2="100%">
