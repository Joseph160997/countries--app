      <path d="M0 132C40 98 76 122 118 100C154 82 180 90 220 120" fill="none" stroke="#f5efe6" stroke-opacity="0.045" stroke-width="2" />
      <path d="M0 180C44 156 72 168 112 148C154 126 184 132 220 170" fill="none" stroke="#f5efe6" stroke-opacity="0.045" stroke-width="2" />
    </pattern>
  </defs>

